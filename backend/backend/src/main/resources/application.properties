server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/transport_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

openweathermap.api.url=https://api.openweathermap.org/data/2.5/weather
openweathermap.api.key=${OPENWEATHER_API_KEY}

fuelprice.api.url=https://api.collectapi.com/economy/gasPrice
fuelprice.api.key=${FUEL_API_KEY}

google.maps.api.url=https://maps.googleapis.com/maps/api/geocode/json
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

telematics.speed.limit=90.0

telematics.fuel.drop.threshold=5.0

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.data.redis.repositories.enabled=false

spring.jpa.properties.hibernate.default_batch_fetch_size=100